name: Build

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Make Gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew jar

    - name: Find built JAR
      id: find-jar
      run: |
        JAR_PATH=$(ls build/libs/xnet-*.jar)
        echo "JAR file found at: $JAR_PATH"
        echo "jar_name=$(basename $JAR_PATH)" >> $GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.find-jar.outputs.jar_name }}
        path: build/libs/${{ steps.find-jar.outputs.jar_name }}
